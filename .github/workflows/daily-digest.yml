name: wechat-radar daily digest

on:
  schedule:
    # 主触发：早上 9 点左右（GitHub 可能有延迟，可接受，不追求准时）
    # CST (UTC+8) 09:07 == UTC 01:07（错开整点，减少排队延迟概率）
    - cron: "7 1 * * *"
    # 补漏检查岗：10:33 左右查一次，主触发如果没成功就自动补一次
    # CST (UTC+8) 10:33 == UTC 02:33
    - cron: "33 2 * * *"
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '7 1 * * *'
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check whether today's digest already succeeded
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(TZ=Asia/Shanghai date +%F)
          runs=$(gh api "repos/${{ github.repository }}/actions/workflows/daily-digest.yml/runs?status=success&per_page=20" --jq '.workflow_runs[] | select(.id != ${{ github.run_id }}) | .created_at')
          already=false
          while IFS= read -r ts; do
            [ -z "$ts" ] && continue
            run_day=$(TZ=Asia/Shanghai date -d "$ts" +%F)
            if [ "$run_day" = "$today" ]; then
              already=true
              break
            fi
          done <<< "$runs"
          if [ "$already" = "true" ]; then
            echo "今天已经成功跑过一次，跳过"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "今天还没成功跑过，继续执行"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  watchdog:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '33 2 * * *'
    steps:
      - name: Check today's digest, re-trigger if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(TZ=Asia/Shanghai date +%F)
          runs=$(gh api "repos/${{ github.repository }}/actions/workflows/daily-digest.yml/runs?status=success&per_page=20" --jq '.workflow_runs[].created_at')
          already=false
          while IFS= read -r ts; do
            [ -z "$ts" ] && continue
            run_day=$(TZ=Asia/Shanghai date -d "$ts" +%F)
            if [ "$run_day" = "$today" ]; then
              already=true
              break
            fi
          done <<< "$runs"
          if [ "$already" = "true" ]; then
            echo "今天已经成功跑过，watchdog 不需要补触发"
          else
            echo "今天还没成功跑过，watchdog 补触发一次"
            gh workflow run daily-digest.yml --ref "${{ github.ref_name }}"
          fi

  run:
    needs: [guard]
    if: >-
      always() && (
        github.event_name != 'schedule' ||
        (github.event.schedule == '7 1 * * *' && needs.guard.outputs.should_run == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore state cache
        uses: actions/cache/restore@v4
        with:
          path: |
            state.json
            article_cache.json
            fakeid_cache.json
            cubox_favorites.json
            cubox_biz_cache.json
          key: radar-state-${{ github.run_id }}
          restore-keys: radar-state-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write secrets to .env and token.json
        env:
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          CUBOX_TOKEN: ${{ secrets.CUBOX_TOKEN }}
          WECHAT_TOKEN_JSON: ${{ secrets.WECHAT_TOKEN_JSON }}
        run: |
          cat > .env <<EOF
          AI_PROVIDER=$AI_PROVIDER
          AI_API_KEY=$AI_API_KEY
          AI_BASE_URL=$AI_BASE_URL
          AI_MODEL=$AI_MODEL
          FEISHU_WEBHOOK=$FEISHU_WEBHOOK
          EMAIL_USER=$EMAIL_USER
          EMAIL_PASSWORD=$EMAIL_PASSWORD
          EMAIL_TO=$EMAIL_TO
          CUBOX_TOKEN=$CUBOX_TOKEN
          EOF
          echo "$WECHAT_TOKEN_JSON" > token.json

      - name: Refresh Cubox favorites (non-blocking)
        run: python3 cubox_client.py || echo "cubox fetch failed, continuing with local cache"

      - name: Source evolve (non-blocking)
        run: python3 source_evolve.py --apply || echo "source_evolve failed, continuing"

      - name: Run wechat-radar
        run: python3 main.py

      - name: Save state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state.json
            article_cache.json
            fakeid_cache.json
            cubox_favorites.json
            cubox_biz_cache.json
          key: radar-state-${{ github.run_id }}
